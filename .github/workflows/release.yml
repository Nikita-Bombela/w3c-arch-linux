# This workflow builds and publishes releases only in the public repo Nikita-Bombela/w3c-arch-linux; every job checks github.repository.
# A workflow_dispatch run with no tag is a dry run in either repo: it tests, builds and smoke-tests, uploads the packages, the SRPM and the Debian source package as run artifacts and never publishes or pushes.
# A dispatch with tag vX.Y.Z in the public repo skips test to publish and runs fetch-release, push-copr, push-obs and verify-repos for that release, so a red push is fixed without retagging.
# The chain is test -> tarball (version gate) -> build-{arch,rpm,deb} -> smoke-{arch,rpm,deb} -> publish -> push-copr and push-obs; smoke-deb runs on debian:stable and ubuntu:latest.
# publish needs every smoke job and uses no status function, so a failed or skipped smoke job skips publish; only the push jobs and verify-repos use !cancelled() next to explicit needs results.
# No job needs a push job, so a red push never touches the release. tests/phase13.sh and tests/phase21.sh pin this wiring, and tests/phase14.sh the test legs.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Empty: dry run. vX.Y.Z: push that published release to Copr and OBS again, without retagging (public repo only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    name: tests ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: doctor
            suites: 'tests/phase[12].sh'
          - name: launch
            suites: 'tests/phase[34].sh tests/phase10.sh'
          - name: nat
            suites: 'tests/phase5.sh'
          - name: distribution
            suites: 'tests/phase[678].sh tests/phase1[1-9].sh tests/phase2[0-9].sh'
    # --init: a reaping PID 1, so a killed orphan tail does not linger as a zombie that kill -0 still sees (phase5, phase6)
    container:
      image: archlinux:latest
      options: --init
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: pacman -Syu and job tools
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git base-devel sudo shellcheck

      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: builder user and workspace ownership
        run: |
          useradd -m builder
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: README and PKGBUILD packages
        run: |
          readme=$(sed -n 's/^On Arch: `sudo pacman -S --needed \(.*\)`$/\1/p' README.md)
          # faugus-launcher is AUR-only, so pacman -S cannot install it
          opt=$(bash -c 'source packaging/PKGBUILD; for o in "${optdepends[@]}"; do printf "%s\n" "${o%%:*}"; done' | grep -vx faugus-launcher)
          if [ -z "$readme" ] || [ -z "$opt" ]; then
            echo "::error title=packages::package list not found in README.md or packaging/PKGBUILD"
            exit 1
          fi
          # unquoted on purpose: both are word lists
          # shellcheck disable=SC2086
          pacman -S --noconfirm --needed $readme $opt

      - name: make check
        timeout-minutes: 25
        env:
          SUITES: ${{ matrix.suites }}
        run: runuser -u builder -- env HOME=/home/builder bash -c 'cd "$GITHUB_WORKSPACE" && make check SUITES="$SUITES"'

  tarball:
    needs: [test]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: version gate and tarball
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(sed -n 's/^W3C_LINUX_VERSION=//p' w3c-linux.sh)
          PK=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          printf '%s' "$VER" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::W3C_LINUX_VERSION is '$VER', want N.N.N"; exit 1; }
          [ "$VER" = "$PK" ] || { echo "::error::W3C_LINUX_VERSION is $VER but pkgver is $PK"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$VER" ] || { echo "::error::tag is $REF_NAME but the version is $VER"; exit 1; }
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --prefix="w3c-linux-$VER/" -o "w3c-linux-$VER.tar.gz" HEAD

      - name: upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: w3c-linux-*.tar.gz
          if-no-files-found: error

  build-arch:
    needs: [tarball]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    # no checkout: packaging/ comes out of the tarball, which proves the release asset is self-contained
    steps:
      - name: pacman -Syu and build tools
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed base-devel

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      - name: makepkg from the tarball
        run: |
          mkdir -p build dist
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/PKGBUILD" > build/PKGBUILD
          cp "in/w3c-linux-$VER.tar.gz" build/
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # --skipinteg: the pinned hash belongs to the previous release; SRCDEST holds the tarball, so makepkg never downloads
          runuser -u builder -- env PKGDEST="$PWD/dist" SRCDEST="$PWD/build" bash -c 'cd build && makepkg -d --check --skipinteg'
          test -f "dist/w3c-linux-$VER-1-any.pkg.tar.zst"

      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-arch
          path: dist/w3c-linux-*-any.pkg.tar.zst
          if-no-files-found: error

  smoke-arch:
    needs: [tarball, build-arch]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: download package
        uses: actions/download-artifact@v8
        with:
          name: pkg-arch
          path: dist

      - name: install, version and doctor
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          # the sync: a fresh image has no databases, so pacman -U could not resolve python
          pacman -Syu --noconfirm
          pacman -U --noconfirm "dist/w3c-linux-$VER-1-any.pkg.tar.zst"
          got=$(w3c-linux version)
          if [ "$got" != "w3c-linux $VER" ]; then
            echo "::error::w3c-linux version printed '$got', want 'w3c-linux $VER'"
            exit 1
          fi
          # no Faugus here: doctor must run to its last row and exit exactly 1; capturing rc keeps bash -e from aborting on it
          rc=0
          out=$(w3c-linux doctor) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 1 ] || { echo "::error::doctor exited $rc, want 1"; exit 1; }
          grep -q '^fail  games.json' <<< "$out" || { echo "::error::doctor has no fail row for games.json"; exit 1; }
          grep -q "^pass  version .*w3c-linux $VER" <<< "$out" || { echo "::error::doctor has no pass row for version w3c-linux $VER"; exit 1; }
          last=${out##*$'\n'}
          case $last in
            'pass  desktop entry'*) ;;
            *) echo "::error::doctor's last row is '$last', want pass  desktop entry"; exit 1 ;;
          esac

  build-rpm:
    needs: [tarball]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    # no checkout: the spec comes out of the tarball, which proves the release asset is self-contained
    steps:
      - name: build tools
        run: dnf install -y rpm-build make

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      - name: rpmbuild from the tarball
        run: |
          mkdir -p rpm/SOURCES dist
          cp "in/w3c-linux-$VER.tar.gz" rpm/SOURCES/
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/w3c-linux.spec" > rpm/w3c-linux.spec
          rpmbuild -bb --define "_topdir $PWD/rpm" --define "w3c_version $VER" rpm/w3c-linux.spec
          # the D-13 name: a tool that names its output differently fails this copy
          cp "rpm/RPMS/noarch/w3c-linux-$VER-1.noarch.rpm" dist/

      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-rpm
          path: dist/w3c-linux-*.noarch.rpm
          if-no-files-found: error

      # the D-10 dry-run artifact: the pinned SRPM, built by the script that is inside the tarball; nothing here reaches a network service
      - name: SRPM from the tarball
        run: |
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/mk-srpm.sh" > mk-srpm.sh
          bash mk-srpm.sh "$VER" "in/w3c-linux-$VER.tar.gz" srpm

      - name: upload SRPM
        uses: actions/upload-artifact@v7
        with:
          name: srpm
          path: srpm/w3c-linux-*.src.rpm
          if-no-files-found: error

  smoke-rpm:
    needs: [tarball, build-rpm]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: download package
        uses: actions/download-artifact@v8
        with:
          name: pkg-rpm
          path: dist

      - name: install, version and doctor
        run: |
          # dnf's defaults: weak dependencies on, so the unavailable faugus-launcher is skipped, not fatal
          dnf install -y "./dist/w3c-linux-$VER-1.noarch.rpm"
          got=$(w3c-linux version)
          if [ "$got" != "w3c-linux $VER" ]; then
            echo "::error::w3c-linux version printed '$got', want 'w3c-linux $VER'"
            exit 1
          fi
          # no Faugus here: doctor must run to its last row and exit exactly 1; capturing rc keeps bash -e from aborting on it
          rc=0
          out=$(w3c-linux doctor) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 1 ] || { echo "::error::doctor exited $rc, want 1"; exit 1; }
          grep -q '^fail  games.json' <<< "$out" || { echo "::error::doctor has no fail row for games.json"; exit 1; }
          grep -q "^pass  version .*w3c-linux $VER" <<< "$out" || { echo "::error::doctor has no pass row for version w3c-linux $VER"; exit 1; }
          last=${out##*$'\n'}
          case $last in
            'pass  desktop entry'*) ;;
            *) echo "::error::doctor's last row is '$last', want pass  desktop entry"; exit 1 ;;
          esac

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      # D-15: the umu fallback and backend set, as a non-root user, by the script that is inside the tarball
      - name: umu fallback and backend set, as a non-root user
        run: |
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/smoke-umu.sh" > smoke-umu.sh
          bash smoke-umu.sh

  build-deb:
    needs: [tarball]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    # no checkout: debian/ comes out of the tarball, which proves the release asset is self-contained
    steps:
      - name: build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper fakeroot

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      - name: dpkg-buildpackage from the tarball
        run: |
          mkdir -p b dist
          tar -xzf "in/w3c-linux-$VER.tar.gz" -C b
          cd "b/w3c-linux-$VER"
          cp -r packaging/debian debian
          # the changelog trailer comes from control, so the two cannot disagree (D-14)
          maint=$(sed -n 's/^Maintainer: //p' debian/control)
          [ -n "$maint" ] || { echo "::error::debian/control has no Maintainer line"; exit 1; }
          printf 'w3c-linux (%s-1) unstable; urgency=medium\n\n  * Release %s.\n\n -- %s  %s\n' "$VER" "$VER" "$maint" "$(date -R)" > debian/changelog
          dpkg-buildpackage -b -us -uc
          # the D-13 name: a tool that names its output differently fails this copy
          cp "../w3c-linux_${VER}-1_all.deb" ../../dist/

      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-deb
          path: dist/w3c-linux_*_all.deb
          if-no-files-found: error

      # the D-10 dry-run artifact: the 3.0 (quilt) source package, built by the script that is inside the tarball; nothing here reaches a network service
      - name: Debian source package from the tarball
        run: |
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/mk-dsc.sh" > mk-dsc.sh
          bash mk-dsc.sh "$VER" "in/w3c-linux-$VER.tar.gz" dsc

      - name: upload Debian source package
        uses: actions/upload-artifact@v7
        with:
          name: dsc
          path: |
            dsc/w3c-linux_*.orig.tar.gz
            dsc/w3c-linux_*.debian.tar.xz
            dsc/w3c-linux_*.dsc
          if-no-files-found: error

  smoke-deb:
    needs: [tarball, build-deb]
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux')
    name: smoke-deb (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:latest']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
      VER: ${{ needs.tarball.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: download package
        uses: actions/download-artifact@v8
        with:
          name: pkg-deb
          path: dist

      - name: install, version and doctor
        run: |
          # apt's defaults: Recommends on, so the unavailable faugus-launcher is skipped, not fatal; the update and the ./ are both needed
          apt-get update
          apt-get install -y "./dist/w3c-linux_${VER}-1_all.deb"
          got=$(w3c-linux version)
          if [ "$got" != "w3c-linux $VER" ]; then
            echo "::error::w3c-linux version printed '$got', want 'w3c-linux $VER'"
            exit 1
          fi
          # no Faugus here: doctor must run to its last row and exit exactly 1; capturing rc keeps bash -e from aborting on it
          rc=0
          out=$(w3c-linux doctor) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 1 ] || { echo "::error::doctor exited $rc, want 1"; exit 1; }
          grep -q '^fail  games.json' <<< "$out" || { echo "::error::doctor has no fail row for games.json"; exit 1; }
          grep -q "^pass  version .*w3c-linux $VER" <<< "$out" || { echo "::error::doctor has no pass row for version w3c-linux $VER"; exit 1; }
          last=${out##*$'\n'}
          case $last in
            'pass  desktop entry'*) ;;
            *) echo "::error::doctor's last row is '$last', want pass  desktop entry"; exit 1 ;;
          esac

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      # D-15: the umu fallback and backend set, as a non-root user, by the script that is inside the tarball
      - name: umu fallback and backend set, as a non-root user
        run: |
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/packaging/smoke-umu.sh" > smoke-umu.sh
          bash smoke-umu.sh

  publish:
    needs: [tarball, smoke-arch, smoke-rpm, smoke-deb]
    if: github.event_name == 'push' && github.repository == 'Nikita-Bombela/w3c-arch-linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VER: ${{ needs.tarball.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: download every artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS and release
        run: |
          cd dist
          sha256sum "w3c-linux-$VER.tar.gz" "w3c-linux-$VER-1-any.pkg.tar.zst" "w3c-linux-$VER-1.noarch.rpm" "w3c-linux_${VER}-1_all.deb" > SHA256SUMS
          {
            printf '%s\n\n' 'Install the package for your distro. The README lists the other packages and how to get Faugus Launcher.'
            printf '%s\n\n' 'Fedora and Debian/Ubuntu can also install w3c-linux from its Copr and OBS repositories, which bring each new release through dnf or apt; the README has the lines.'
            printf -- '- Arch: `sudo pacman -U ./w3c-linux-%s-1-any.pkg.tar.zst`\n' "$VER"
            printf -- '- Fedora: `sudo dnf install ./w3c-linux-%s-1.noarch.rpm`\n' "$VER"
            printf -- '- Debian/Ubuntu: `sudo apt install ./w3c-linux_%s-1_all.deb`\n' "$VER"
            printf '\n%s\n' 'README: https://github.com/Nikita-Bombela/w3c-arch-linux#readme'
          } > ../notes.md
          gh release create "$TAG" "w3c-linux-$VER.tar.gz" "w3c-linux-$VER-1-any.pkg.tar.zst" "w3c-linux-$VER-1.noarch.rpm" "w3c-linux_${VER}-1_all.deb" SHA256SUMS --verify-tag --title "w3c-linux $VER" --notes-file ../notes.md

  # D-06, D-07: a republish downloads the published release and checks it; it never builds, uploads, moves or deletes anything, and the version comes only from the checked tag
  fetch-release:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.repository == 'Nikita-Bombela/w3c-arch-linux'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: download and check the release
        id: get
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag input is not vN.N.N"; exit 1; }
          VER=${TAG#v}
          gh release download "$TAG" -p "w3c-linux-$VER.tar.gz" -p SHA256SUMS -D in
          (cd in && sha256sum -c --ignore-missing SHA256SUMS)
          tar -xzf "in/w3c-linux-$VER.tar.gz" -O "w3c-linux-$VER/w3c-linux.sh" | grep -qxF "W3C_LINUX_VERSION=$VER" || { echo "::error::the tarball's W3C_LINUX_VERSION differs from the tag"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: in/w3c-linux-*.tar.gz
          if-no-files-found: error

  # D-05, D-18: after publish and outside its needs, so a red push leaves the published release as it is; the scripts come from the run's ref (the tag's own commit on a tag run).
  # !cancelled() drops the implicit success() that a skipped need would trip; the explicit results decide (push-obs has the same if):
  #   tag push, publish success, fetch-release skipped: push runs      dispatch with a tag, publish skipped, fetch-release success: push runs
  #   dry run, both skipped: push skipped (D-10)                        publish or fetch-release failed: push skipped      run cancelled: push skipped
  push-copr:
    needs: [tarball, publish, fetch-release]
    if: ${{ !cancelled() && github.repository == 'Nikita-Bombela/w3c-arch-linux' && (needs.publish.result == 'success' || needs.fetch-release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: package-repos
    container:
      image: fedora:latest
    timeout-minutes: 120
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version || needs.fetch-release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Copr and build tools
        run: dnf install -y copr-cli rpm-build make git

      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      - name: SRPM to Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: bash packaging/push-copr.sh "$VER" "in/w3c-linux-$VER.tar.gz"

  # D-05: the same shape as push-copr; osc needs git, and dpkg-dev gives mk-dsc.sh its dpkg-source, so one Fedora container builds and commits
  push-obs:
    needs: [tarball, publish, fetch-release]
    if: ${{ !cancelled() && github.repository == 'Nikita-Bombela/w3c-arch-linux' && (needs.publish.result == 'success' || needs.fetch-release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: package-repos
    container:
      image: fedora:latest
    timeout-minutes: 120
    env:
      LANG: C.UTF-8
      VER: ${{ needs.tarball.outputs.version || needs.fetch-release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: OBS and build tools
        run: dnf install -y osc git dpkg-dev

      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: download tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball
          path: in

      - name: source package to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: bash packaging/push-obs.sh "$VER" "in/w3c-linux-$VER.tar.gz"

  # D-09, D-17: after both pushes, the README's own repository lines install the release in eight images; anonymous reads only, so no environment and no secret.
  # README.md and the script come from the run's ref (the tag's own commit on a tag run), the version from the tarball or fetch-release job.
  verify-repos:
    needs: [tarball, fetch-release, push-copr, push-obs]
    if: ${{ !cancelled() && github.repository == 'Nikita-Bombela/w3c-arch-linux' && needs.push-copr.result == 'success' && needs.push-obs.result == 'success' }}
    name: verify-repos (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:43
            family: fedora
            dist: ''
          - image: fedora:44
            family: fedora
            dist: ''
          - image: fedora:45
            family: fedora
            dist: ''
          - image: fedora:rawhide
            family: fedora
            dist: ''
          - image: debian:12
            family: debian
            dist: Debian_12
          - image: debian:13
            family: debian
            dist: Debian_13
          - image: ubuntu:24.04
            family: debian
            dist: xUbuntu_24.04
          - image: ubuntu:26.04
            family: debian
            dist: xUbuntu_26.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
      VER: ${{ needs.tarball.outputs.version || needs.fetch-release.outputs.version }}
      FAMILY: ${{ matrix.family }}
      DIST: ${{ matrix.dist }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install from the README's repository lines
        run: bash packaging/verify-repo.sh "$FAMILY" "$VER" "$DIST"
