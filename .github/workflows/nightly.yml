# This workflow runs only in the private dev repo Nikita-Bombela/w3c-arch-linux-dev and is not copied to the public repo.
# It installs the project in a fresh Arch container every night and checks the live upstream services the tool depends on.
# The fixture suites and shellcheck run in ci.yml on pull requests into main, not here.
# A failed run reaches the maintainer through GitHub's own failure email; each step name says what broke.
name: nightly dependency check

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    env:
      LANG: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: pacman -Syu and job tools
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git base-devel sudo shellcheck

      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: builder user and workspace ownership
        run: |
          useradd -m builder
          printf '%s\n' 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree

      - name: README and PKGBUILD packages
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          readme=$(sed -n 's/^On Arch: `sudo pacman -S --needed \(.*\)`$/\1/p' README.md)
          opt=$(bash -c 'source packaging/PKGBUILD; for o in "${optdepends[@]}"; do printf "%s\n" "${o%%:*}"; done')
          if [ -z "$readme" ] || [ -z "$opt" ]; then
            echo "::error title=packages::package list not found in README.md or packaging/PKGBUILD"
            exit 1
          fi
          echo "README: $readme"
          echo "optdepends: $opt"
          # unquoted on purpose: both are word lists
          # shellcheck disable=SC2086
          pacman -S --noconfirm --needed $readme $opt

      - name: faugus-launcher AUR build
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          runuser -u builder -- env HOME=/home/builder bash -c '
            cd "$HOME" &&
            for i in 1 2 3; do
              rm -rf faugus-launcher
              git clone --depth 1 https://aur.archlinux.org/faugus-launcher.git && break
              sleep 10
            done &&
            cd faugus-launcher &&
            makepkg -si --noconfirm'
          pacman -Q faugus-launcher

      - name: w3c-linux package build and install
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          runuser -u builder -- env HOME=/home/builder bash -c '
            cd "$GITHUB_WORKSPACE" &&
            v=$(sed -n "s/^pkgver=//p" packaging/PKGBUILD) &&
            git archive --format=tar.gz --prefix="w3c-arch-linux-$v/" -o "packaging/w3c-arch-linux-$v.tar.gz" HEAD &&
            cd packaging &&
            makepkg -si --skipinteg --noconfirm'
          want="w3c-linux $(sed -n 's/^W3C_LINUX_VERSION=//p' w3c-linux.sh)"
          got=$(w3c-linux --version)
          if [ "$got" != "$want" ]; then
            echo "::error title=package::w3c-linux --version printed '$got', w3c-linux.sh says '$want'"
            exit 1
          fi

      - name: doctor on fixture home
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: runuser -u builder -- env HOME=/home/builder W3C_NIGHTLY_REAL_FAUGUS=1 bash tests/phase8.sh 'doctor-*'

      - name: 'live: proton release'
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: runuser -u builder -- env HOME=/home/builder bash tests/live.sh proton

      - name: 'live: launcher latest.json and MSI'
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: runuser -u builder -- env HOME=/home/builder bash tests/live.sh launcher

      - name: 'live: WebView2'
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: runuser -u builder -- env HOME=/home/builder bash tests/live.sh webview2

      - name: 'live: upstream watch (fails on news too)'
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: runuser -u builder -- env HOME=/home/builder bash tests/live.sh watch
